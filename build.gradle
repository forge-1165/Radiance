buildscript {
    repositories {
        maven { url = 'https://maven.minecraftforge.net' }
        mavenCentral()
    }
    dependencies {
        classpath 'net.minecraftforge.gradle:ForgeGradle:2.3-SNAPSHOT'
    }
}

apply plugin: 'net.minecraftforge.gradle'
apply plugin: 'java'
apply plugin: 'maven-publish'

version = project.mod_version
group = project.maven_group
archivesBaseName = project.archives_base_name

sourceCompatibility = targetCompatibility = '1.8'

minecraft {
    version = "${project.minecraft_version}-${project.forge_version}"
    runDir = 'run'
    mappings = project.mappings_version

    makeObfSourceJar = false
}

repositories {
    mavenCentral()
}

dependencies {
    // Renderer dependencies and MCVR JNI integration must be ported separately.
}

// Keep the initial 1.12.2 loader milestone isolated from the 1.20.1 client
// implementation. The latter uses newer Java and Minecraft APIs and cannot
// be compiled against Forge 1.12.2 without a renderer/API rewrite.
sourceSets {
    main {
        java {
            srcDirs = ['src/main/java']
            include 'com/radiance/Radiance.java'
        }
        resources {
            srcDirs = ['src/main/resources']
            exclude 'radiance.mixins.json'
            exclude 'META-INF/mods.toml'
            exclude 'core.dll'
            exclude 'libcore.so'
        }
    }
}

processResources {
    inputs.property 'version', project.version
    inputs.property 'mcversion', project.minecraft_version
    filesMatching('mcmod.info') {
        expand 'version': project.version,
                'mcversion': project.minecraft_version
    }
}

jar {
    manifest {
        attributes([
            'Specification-Title': 'Radiance',
            'Specification-Vendor': 'Radiance Team',
            'Specification-Version': '1',
            'Implementation-Title': project.name,
            'Implementation-Version': project.version,
            'Implementation-Vendor': 'Radiance Team'
        ])
    }
}
